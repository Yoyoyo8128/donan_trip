<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>道南コース2026</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 背景 -->
  <div class="bg-blur"></div>

  <!-- ヘッダー -->
  <header class="hero">
    <div class="overlay"></div>

    <div class="hero-content">
      <img src="assets/images/logo.png" class="logo" alt="logo">

      <h1>道南コース 2026</h1>
      <p class="subtitle">
        Kaisei School Trip 2026.6.1 - 2026.6.5
      </p>

      <div class="hero-buttons">
        <a href="#schedule" class="btn-primary">行程を見る</a>
        <a href="#pdf" class="btn-secondary">しおりPDF</a>
      </div>
    </div>
  </header>

  <!-- お知らせ -->
  <section class="card-section">
    <div class="section-title">
      <h2>お知らせ</h2>
      <span>Announcements</span>
    </div>

    <div class="notice-box">
      <div id="noticeList">
        <div class="notice-item">
          現在お知らせはありません。
        </div>
      </div>
    </div>
  </section>

  <!-- 現在の予定 -->
  <section class="card-section">
    <div class="section-title">
      <h2>現在の予定</h2>
      <span>Live Schedule</span>
    </div>

    <div class="live-card">
      <div class="live-now">
        <p class="live-label">NOW</p>
        <h3 id="currentEvent">読み込み中...</h3>
      </div>

      <div class="live-next">
        <p class="live-label">NEXT</p>
        <h3 id="nextEvent">読み込み中...</h3>
      </div>

      <div class="countdown">
        <p>次の予定まで</p>
        <h1 id="countdown">--:--:--</h1>
      </div>
    </div>
  </section>

  <!-- コース選択 -->
  <section class="card-section" id="schedule">

    <div class="section-title">
      <h2>コース選択</h2>
      <span>Select Course</span>
    </div>

    <div class="course-selector">

      <!-- 2日目 -->
      <div class="selector-group">
        <h3>2日目コース</h3>

        <div class="button-group">
          <button class="course-btn active" data-day="2" data-course="A">コースA</button>
          <button class="course-btn" data-day="2" data-course="B">コースB</button>
          <button class="course-btn" data-day="2" data-course="C">コースC</button>
        </div>
      </div>

      <!-- 3日目 -->
      <div class="selector-group">
        <h3>3日目コース</h3>

        <div class="button-group">
          <button class="course-btn active" data-day="3" data-course="α">コースα</button>
          <button class="course-btn" data-day="3" data-course="β">コースβ</button>
          <button class="course-btn" data-day="3" data-course="γ">コースγ</button>
        </div>
      </div>

    </div>

    <!-- タイムライン -->
    <div class="timeline-container">
      <div id="timeline"></div>
    </div>
  </section>

  <!-- 地図 -->
  <section class="card-section">

    <div class="section-title">
      <h2>移動経路</h2>
      <span>Trip Route</span>
    </div>

    <div class="map-wrapper">
      <img src="assets/images/map.png" alt="map">
    </div>

  </section>

  <!-- PDF -->
  <section class="card-section" id="pdf">

    <div class="section-title">
      <h2>しおりPDF</h2>
      <span>Travel Guide PDF</span>
    </div>

    <div class="pdf-card">
      <iframe
        src="assets/pdf/shiori.pdf"
        width="100%"
        height="700px">
      </iframe>

      <a href="assets/pdf/shiori.pdf" download class="btn-primary pdf-btn">
        PDFをダウンロード
      </a>
    </div>
  </section>

  <!-- フッター -->
  <footer>
    <p>© 2026 Dounan Course Project</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
