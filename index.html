<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>道南コース 公式サイト</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- icon -->
  <link
  rel="icon"
  type="image/png"
  href="images/icon.png">
  <link
  rel="apple-touch-icon"
  href="images/icon.png"
  >

</head>

<body>

  <!-- 背景 -->

  <div class="bg-overlay"></div>

  <div class="bg-glow"></div>

  <div class="bg-glow second"></div>

  <!-- Header -->

  <header class="hero">



    <!-- Hero Image -->

<div class="hero-image">

  <div class="hero-image">

  <img
    src="images/hakodate.jpg"
    alt="函館夜景"
  >

  <div class="hero-image-overlay"></div>

  <div class="hero-image-text">

    <div class="hero-image-sub">
      HOKKAIDO SCHOOL TRIP
    </div>

    <div class="hero-image-title">
      道南コース
    </div>

  </div>

</div>

    <!-- Clock -->

    <div class="clock-card glass">

      <div id="date" class="date">
        Loading...
      </div>

      <div id="clock" class="clock">
        00:00:00
      </div>

    </div>

  </header>

  <!-- Main -->

  <main class="container">

    <!-- NEXT -->

    <section class="next-card glass">

      <div class="next-label">
        NEXT SCHEDULE
      </div>

      <div id="next-time" class="next-time">
        
      </div>

      <div id="next-title" class="next-title">
        
      </div>

      <div id="next-sub" class="next-sub">
        
      </div>

      <div id="countdown" class="countdown">
        
      </div>

    </section>

    <!-- Timeline -->

    <section>

      <div class="section-title">
        今日のスケジュール
      </div>

      <div id="timeline" class="timeline"></div>

    </section>

    <!-- Course -->

    <section class="course-card glass">

      <div class="course-header">

        <div class="section-title no-margin">
          コース設定
        </div>

        <button
          class="setting-btn"
          onclick="location.href='settings.html'"
        >
        
          変更
        </button>

      </div>

      <div
        id="course-day2"
        class="course-item"
      >
        2日目：A
      </div>

      <div
        id="course-day3"
        class="course-item"
      >
        3日目：α
      </div>

      <div
        id="course-day4"
        class="course-item"
      >
        4日目：小樽
      </div>

    </section>

    <!-- Notice -->

    <section class="notice-card">

      <div class="notice-label">
        IMPORTANT
      </div>

      <div
        id="notice-title"
        class="notice-title"
      >
        現在の重要事項はないです
      </div>

      <div
        id="notice-text"
        class="notice-text"
      >
        現在の重要事項はないです
      </div>

    </section>

    <!-- PDF -->

    <section class="pdf-card glass">

      <div>

        <div class="pdf-title">
          📘 しおりPDF
        </div>

        <div class="pdf-sub">
          修学旅行のしおりを見る
        </div>

      </div>

      <a
        href="pdf/shiori.pdf"
        target="_blank"
        class="pdf-btn"
      >
        開く
      </a>

    </section>

  </main>

  <!-- Bottom Nav -->

    <nav class="bottom-nav">

    <a
        href="index.html"
        class="nav-item active"
    >
    <span>🏠</span>
    <small>ホーム</small>
    </a>

    <a
        href="schedule.html"
        class="nav-item"
    >
    <span>🗓</span>
    <small>行程</small>
    </a>

    <a
        href="notice.html"
        class="nav-item"
    >
    <span>📢</span>
    <small>連絡</small>
    </a>

    <a
        href="pdf/shiori.pdf"
        target="_blank"
        class="nav-item"
    >
    <span>📘</span>
    <small>しおり</small>
    </a>

    <a
        href="settings.html"
        class="nav-item"
    >
        <span>⚙</span>
        <small>コース設定</small>
        </button>

    </nav>

  <!-- Settings Modal -->

  <div
    class="modal"
    id="settingsModal"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h2>
          コース設定
        </h2>

        <button
          class="close-btn"
          onclick="closeSettings()"
        >
          ✕
        </button>

      </div>

      <!-- Day2 -->

      <div class="modal-section">

        <div class="modal-label">
          2日目
        </div>

        <div class="course-grid">

          <button
            class="course-option"
            onclick="selectDay2('A')"
          >
            A
          </button>

          <button
            class="course-option"
            onclick="selectDay2('B')"
          >
            B
          </button>

          <button
            class="course-option"
            onclick="selectDay2('C')"
          >
            C
          </button>

        </div>

      </div>

      <!-- Day3 -->

      <div class="modal-section">

        <div class="modal-label">
          3日目
        </div>

        <div class="course-grid">

          <button
            class="course-option"
            onclick="selectDay3('α')"
          >
            α
          </button>

          <button
            class="course-option"
            onclick="selectDay3('β')"
          >
            β
          </button>

          <button
            class="course-option"
            onclick="selectDay3('γ')"
          >
            γ
          </button>

        </div>

      </div>

      <button
        class="save-btn"
        onclick="saveSettings()"
      >
        保存
      </button>

    </div>

  </div>

  <!-- JS -->

  <script src="data.js"></script>
  <script src="script.js"></script>

</body>
</html>
