<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>道南コース</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- 背景 -->
  <div class="background"></div>

  <!-- ヘッダー -->
  <header>
    <div class="logo">
      道南コース
    </div>

    <div class="date-box">
      <span id="current-time"></span>
    </div>
  </header>

  <!-- メイン -->
  <main>

    <!-- ヒーロー -->
    <section class="hero glass">
      <h1>Kaisei School Trip 2026</h1>
      <p>北海道・道南エリア</p>

      <select id="course-select">
        <option value="A">コースA</option>
        <option value="B">コースB</option>
        <option value="C">コースC</option>
        <option value="alpha">コースα</option>
        <option value="beta">コースβ</option>
        <option value="gamma">コースγ</option>
      </select>
    </section>

    <!-- 次の予定 -->
    <section class="next-event glass">
      <h2>次の予定</h2>

      <div class="event-card">
        <div class="event-time" id="event-time">
          13:30
        </div>

        <div class="event-content">
          <h3 id="event-title">
            大沼公園着
          </h3>

          <p id="event-description">
            カヌー体験
          </p>
        </div>
      </div>
    </section>

    <!-- タイムライン -->
    <section class="timeline glass">
      <h2>今日のスケジュール</h2>

      <div class="timeline-item active">
        <div class="circle"></div>
        <div class="timeline-content">
          <h3>08:00 羽田集合</h3>
          <p>第2ターミナル B1階</p>
        </div>
      </div>

      <div class="timeline-item">
        <div class="circle"></div>
        <div class="timeline-content">
          <h3>09:45 出発</h3>
          <p>ANA553便</p>
        </div>
      </div>

      <div class="timeline-item">
        <div class="circle"></div>
        <div class="timeline-content">
          <h3>11:05 函館到着</h3>
          <p>函館空港</p>
        </div>
      </div>
    </section>

    <!-- マップ -->
    <section class="map-section glass">
      <h2>移動マップ</h2>

      <div class="map-container">

        <img src="map.png" class="map-image">

        <div class="marker">
          😊
        </div>

      </div>
    </section>

    <!-- お知らせ -->
    <section class="news glass">
      <h2>お知らせ</h2>

      <div class="news-card">
        <span class="news-date">6/1</span>
        <p>17:00 花びしホテル集合</p>
      </div>

      <div class="news-card">
        <span class="news-date">6/1</span>
        <p>搭乗前にトイレを済ませてください</p>
      </div>
    </section>

    <!-- PDF -->
    <section class="pdf glass">
      <h2>しおりPDF</h2>

      <a href="shiriori.pdf" target="_blank" class="pdf-button">
        PDFを開く
      </a>
    </section>

  </main>

  <!-- 下タブ -->
  <nav class="bottom-nav">

    <button class="nav-item active">
      🏠
      <span>ホーム</span>
    </button>

    <button class="nav-item">
      🗓
      <span>予定</span>
    </button>

    <button class="nav-item">
      🗺
      <span>マップ</span>
    </button>

    <button class="nav-item">
      📄
      <span>しおり</span>
    </button>

  </nav>

  <script src="script.js"></script>
</body>
</html>
