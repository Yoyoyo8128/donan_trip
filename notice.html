  <!-- JavaScript -->

  <script>

    // =====================================
    // 連絡データ
    // =====================================
    //
    // ▼ 連絡を追加する方法
    //
    // 下の notices に追加するだけ！
    //
    // 例：
    //
    // {
    //   title: "集合場所変更",
    //   body: "正面玄関集合になりました",
    //   time: "6/2 14:20"
    // }
    //
    // をコピーして増やせばOK！
    //
    // ※ 最後のデータ以外には「,」が必要
    //
    // =====================================

    let notices = [
        //例る
        //{
        //    title: "学マス",
        //    body: "りーりやかわいいね",
        //    time:"8/10 11:45"
        //},
      

      

      {
        title: "公式サイト",
        body: "道南コースの公式サイトを立ち上げました！",
        time: "5/30 5:21"
      }

      

    ];
    // =====================================
    // localStorage に保存
    // =====================================

    localStorage.setItem(
        "notices",
        JSON.stringify(notices)
    );


    // =====================================
    // 連絡表示
    // =====================================

    function renderNotices(){

      const noticeList =
        document.getElementById("notice-list");

      noticeList.innerHTML = "";

      notices.forEach(notice => {

        const card =
          document.createElement("div");

        card.className =
          "notice-item glass";

        card.innerHTML = `

          <div class="notice-time">
            ${notice.time}
          </div>

          <div class="notice-card-title">
            ${notice.title}
          </div>

          <div class="notice-card-body">
            ${notice.body}
          </div>

        `;

        noticeList.appendChild(card);

      });

    }

    renderNotices();

  </script>
