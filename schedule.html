<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>行程 | 道南コース</title>

  <!-- Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->

  <link rel="stylesheet" href="style.css" />

</head>

<body class="schedule-body">

  <!-- Background -->

  <div class="bg-overlay"></div>

  <div class="bg-glow"></div>

  <div class="bg-glow second"></div>

  <!-- Header -->

  <header class="page-header">

    <div class="mini-title">
      SCHEDULE
    </div>

    <h1 class="page-title">
      行程
    </h1>

    <p class="page-subtitle">
      修学旅行のスケジュール
    </p>

  </header>

  <!-- Day Tabs -->

  <div class="day-tabs">

    <button
      class="day-tab active"
      onclick="showDay(1)"
    >
      1日目
    </button>

    <button
      class="day-tab"
      onclick="showDay(2)"
    >
      2日目
    </button>

    <button
      class="day-tab"
      onclick="showDay(3)"
    >
      3日目
    </button>

    <button
      class="day-tab"
      onclick="showDay(4)"
    >
      4日目
    </button>

  </div>

  <!-- Main -->

  <main class="schedule-container">

    <!-- DAY 1 -->

    <section
      id="day1"
      class="day-content active"
    >

      <div class="timeline-card glass">

        <div id="day1-timeline"></div>

      </div>

    </section>

    <!-- DAY 2 -->

    <section
      id="day2"
      class="day-content"
    >

      <div class="timeline-card glass">

        <div
          id="day2-course-badge"
          class="course-badge"
        >
          現在のコース：A
        </div>

        <div id="day2-timeline"></div>

      </div>

    </section>

    <!-- DAY 3 -->

    <section
      id="day3"
      class="day-content"
    >

      <div class="timeline-card glass">

        <div
          id="day3-course-badge"
          class="course-badge"
        >
          現在のコース：α
        </div>

        <div id="day3-timeline"></div>

      </div>

    </section>

    <!-- DAY 4 -->

    <section
      id="day4"
      class="day-content"
    >

      <div class="timeline-card glass">

        <div
          id="day4-course-badge"
          class="course-badge"
        >
          現在のコース：小樽
        </div>

        <div id="day4-timeline"></div>

      </div>

    </section>

  </main>

  <!-- Bottom Nav -->

  <nav class="bottom-nav">

    <a
      href="index.html"
      class="nav-item"
    >
      <span>🏠</span>
      <small>ホーム</small>
    </a>

    <a
      href="schedule.html"
      class="nav-item active"
    >
      <span>🗓</span>
      <small>行程</small>
    </a>

    <a
      href="notice.html"
      class="nav-item"
    >
      <span>📢</span>
      <small>連絡</small>
    </a>

    <a
      href="pdf/shiori.pdf"
      target="_blank"
      class="nav-item"
    >
      <span>📘</span>
      <small>しおり</small>
    </a>

    <a
      href="settings.html"
      class="nav-item"
    >
      <span>⚙</span>
      <small>設定</small>
    </a>

  </nav>

  <!-- data.js -->

  <script src="data.js"></script>

  <!-- Script -->

  <script>

    // =====================================
    // タブ切替
    // =====================================

    function showDay(day){

      document
        .querySelectorAll(".day-tab")
        .forEach(tab => {

          tab.classList.remove("active");

        });

      document
        .querySelectorAll(".day-content")
        .forEach(content => {

          content.classList.remove("active");

        });

      document
        .querySelectorAll(".day-tab")[day - 1]
        .classList.add("active");

      document
        .getElementById(`day${day}`)
        .classList.add("active");

    }



    // =====================================
    // コース取得
    // =====================================

    const courseDay2 =
      localStorage.getItem("courseDay2")
      || "A";

    const courseDay3 =
      localStorage.getItem("courseDay3")
      || "α";

    const courseDay4 =
      localStorage.getItem("courseDay4")
      || "小樽";



    // =====================================
    // 工程描画
    // =====================================

    function renderTimeline(
        targetId,
        ...scheduleGroups
    ){

        const target =
        document.getElementById(targetId);

        if(!target){

        return;

        }

    // 初期化

    target.innerHTML = "";

    // 配列合体

    const mergedSchedules =
    scheduleGroups.flat();

    // 描画

    mergedSchedules.forEach(item => {

        const time = item[0];
        const title = item[1];
        const desc = item[2];

        target.innerHTML += `

      <div class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">

          <div class="timeline-time">
            ${time}
          </div>

          <div class="timeline-title">
            ${title}
          </div>

          <div class="timeline-desc">
            ${desc}
          </div>

        </div>

      </div>

    `;

        });

    }



    // =====================================
    // バッジ更新
    // =====================================

    document.getElementById(
      "day2-course-badge"
    ).textContent =
      `現在のコース：${courseDay2}`;

    document.getElementById(
      "day3-course-badge"
    ).textContent =
      `現在のコース：${courseDay3}`;

    document.getElementById(
      "day4-course-badge"
    ).textContent =
      `現在のコース：${courseDay4}`;



    // =====================================
    // 描画実行
    // =====================================

    renderTimeline(
      "day1-timeline",
      schedules.day1
    );

    renderTimeline(
      "day2-timeline",
      schedules.day2_mae,
      schedules.day2[courseDay2],
      schedules.day2_ato
    );

    renderTimeline(
      "day3-timeline",
      schedules.day3[courseDay3]
    );

    renderTimeline(
      "day4-timeline",
      schedules.day4[courseDay4]
    );

  </script>

</body>
</html>
